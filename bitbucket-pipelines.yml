
image: mcr.microsoft.com/playwright:v1.65.1-noble

pipelines:
  default:
    - step:
        name: Playwright Automation Tests
        caches:
          - node
        script:
          - echo "Installing dependencies"
          - npm ci
          - echo "Checking Playwright version"
          - npx playwright --version
          - echo "Running Playwright Tests"
          - npx playwright test
        artifacts:
          - playwright-report/**
          - test-results/**
